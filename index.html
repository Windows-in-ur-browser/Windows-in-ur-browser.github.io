<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 95 iPad Emulator</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #screen_container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="screen_container">
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            // Direct Link to your uploaded image
            const FILEBIN_URL = "https://filebin.net"; 
            
            // Hardcoded precise byte size to skip Filebin's network filter blocks
            const EXACT_FILE_SIZE = 536870912; 

            var emulator = new V86({
                wasm_path: "https://jsdelivr.net",
                bios: { url: "https://jsdelivr.net" },
                vga_bios: { url: "https://jsdelivr.net" },
                
                screen_container: document.getElementById("screen_container"),
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                boot_order: 0x312, 
                autostart: true,
                hda: {
                    url: FILEBIN_URL, 
                    size: EXACT_FILE_SIZE, 
                    async: true 
                }
            });
        };
    </script>
</body>
</html>
