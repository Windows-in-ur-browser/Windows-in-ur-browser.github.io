
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 Browser Emulator</title>
    <!-- CSS to force the emulator canvas to stay full-screen and centered -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #screen_container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
    <!-- Load the main v86 emulator library from a public CDN -->
    <script src="https://copy.sh"></script>
</head>
<body>

    <!-- The emulator will render the video output inside this div container -->
    <div id="screen_container">
        <canvas></canvas>
    </div>

    <script>
        window.onload = function() {
            // Configuration object for the v86 emulator
            var emulator = new V86({
                // Points to the required WebAssembly compiled binary
                wasm_path: "https://copy.sh",
                
                // Mounts your screen inside the HTML container element
                screen_container: document.getElementById("screen_container"),
                
                // Memory configuration for a smooth Windows 95 environment (64MB)
                memory_size: 64 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                
                // Automatically boots the primary hard drive image
                boot_order: 0x312, 

                // --- DISK IMAGE CONFIGURATION ---
                // Replace this path with the actual filename of your pre-installed Windows 95 drive image.
                // Keep the image in the same folder as this index.html file in your GitHub repo.
                hda: {
                    url: "win95.img", 
                    async: true, // Enables lazy-loading chunks instead of downloading the whole file at once
                    size: 512 * 1024 * 1024 // Set this to the EXACT file size of your image in bytes if async is true
                },

                // Optional: BIOS and VGA BIOS files used to safely initialize the virtual machine
                bios: { url: "https://copy.sh" },
                vga_bios: { url: "https://copy.sh" },
            });
        };
    </script>
</body>
</html>
