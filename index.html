<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windows 95 iPad Emulator</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        #screen_container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; max-width: 100%; max-height: 100%; object-fit: contain; image-rendering: pixelated; }
    </style>
    <script src="https://copy.sh"></script>
</head>
<body>

    <div id="screen_container">
        <canvas></canvas>
    </div>

    <script>
        // Your uncompressed Filebin disk link
        const FILEBIN_URL = "https://filebin.net/dz3liptbze7hekkj/Windows95b_p9x-0.9.91.img"; 

        window.onload = function() {
            // Automatically measures the image size from Filebin over the network
            fetch(FILEBIN_URL, { method: "HEAD" }).then(response => {
                const totalBytes = parseInt(response.headers.get("content-length"), 10);
                
                if (!totalBytes || isNaN(totalBytes)) {
                    console.error("Could not fetch file size automatically.");
                    alert("Could not load file size. Please ensure the Filebin upload finished completely.");
                    return;
                }

                var emulator = new V86({
                    wasm_path: "https://copy.sh",
                    screen_container: document.getElementById("screen_container"),
                    memory_size: 64 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    boot_order: 0x312, 
                    autostart: true,
                    hda: {
                        url: FILEBIN_URL, 
                        size: totalBytes, 
                        async: true 
                    },
                    bios: { url: "https://copy.sh" },
                    vga_bios: { url: "https://copy.sh" },
                });
            }).catch(err => {
                alert("Error connecting to file server.");
            });
        };
    </script>
</body>
</html>
